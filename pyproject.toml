[project]
name = "alphafolio"
version = "1.0.0"
description = "Portfolio simulation tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.41.1",
    "yfinance>=0.2.51",
]

[dependency-groups]
doc = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.49",
    "mkdocstrings[python]>=0.27.0",
]
dev = [
    "ipykernel>=6.29.5",
    "mypy>=1.14.1",
    "rich>=13.9.4",
    "ruff>=0.8.6",
]
